        var cards = document.querySelectorAll('.how-card');
        var dots = document.querySelectorAll('.how-dot');
        if ('IntersectionObserver' in window && cards.length) {
            var io2 = new IntersectionObserver(function (entries) {
                entries.forEach(function (e) {
                    if (!e.isIntersecting) return;
                    var i = e.target.getAttribute('data-i');
                    cards.forEach(function (c) { c.classList.toggle('active', c.getAttribute('data-i') === i); });
                    dots.forEach(function (d) { d.classList.toggle('active', d.getAttribute('data-i') === i); });
                });
            }, { rootMargin: '-40% 0px -40% 0px' });
            cards.forEach(function (c) { io2.observe(c); });
        }

        window.openPalette = function () { var p = document.getElementById('palette'); p.classList.remove('hidden'); p.classList.add('flex'); };
        window.closePalette = function () { var p = document.getElementById('palette'); p.classList.add('hidden'); p.classList.remove('flex'); };
        window.goPalette = function (hash, tab) {
            closePalette();
            if (tab && typeof switchBookingTab === 'function') switchBookingTab(tab);
            var el = document.querySelector(hash);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        document.addEventListener('keydown', function (ev) {
            if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); openPalette(); }
            if (ev.key === 'Escape') closePalette();
        });
    })();
